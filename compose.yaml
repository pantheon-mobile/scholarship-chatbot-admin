
services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    command: ["npm", "run", "dev", "--", "--hostname", "0.0.0.0", "--port", "3000"]

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/scholarship
      - BACKEND_PORT=8000
      - UPLOAD_DIR=/app/storage/uploads
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - AWS_REGION=${AWS_REGION:-ap-northeast-1}
      - INGESTION_S3_BUCKET=${INGESTION_S3_BUCKET:-}
      - INGESTION_ORIGINAL_PREFIX=${INGESTION_ORIGINAL_PREFIX:-documents/admin/originals/}
      - ANALYTICS_IDENTITY_SECRET=local-development-analytics-secret-change-in-production
      - APP_ENV=development
      - ENABLE_DEVELOPMENT_CPF_MOCK=${ENABLE_DEVELOPMENT_CPF_MOCK:-true}
      - CPF_DEVELOPMENT_JWT_SECRET=${CPF_DEVELOPMENT_JWT_SECRET:-local-development-cpf-jwt-secret-change-before-shared-use}
      - CPF_DEVELOPMENT_JWT_TTL_SECONDS=${CPF_DEVELOPMENT_JWT_TTL_SECONDS:-300}
      - CPF_PUBLIC_KEYS=${CPF_PUBLIC_KEYS:-}
      - CPF_PUBLIC_KEY_PATHS=${CPF_PUBLIC_KEY_PATHS:-}
      - CPF_JWT_ISSUER=${CPF_JWT_ISSUER:-cpf}
      - CPF_JWT_AUDIENCE=${CPF_JWT_AUDIENCE:-chatbot}
      - CPF_ACCEPTED_ROLES=${CPF_ACCEPTED_ROLES:-admin,staff}
      - CPF_JWT_LEEWAY_SECONDS=${CPF_JWT_LEEWAY_SECONDS:-30}
      - CPF_JWT_MAX_TTL_SECONDS=${CPF_JWT_MAX_TTL_SECONDS:-360}
      - AUTH_SESSION_TTL_SECONDS=${AUTH_SESSION_TTL_SECONDS:-28800}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-false}
      - AUTH_COOKIE_DOMAIN=${AUTH_COOKIE_DOMAIN:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - CHAT_KNOWLEDGE_BASE_ID=${CHAT_KNOWLEDGE_BASE_ID:-}
      - CHAT_MODEL_ARN=${CHAT_MODEL_ARN:-}
      - CHAT_SEARCH_TYPE=${CHAT_SEARCH_TYPE:-HYBRID}
      - CHAT_NUMBER_OF_RESULTS=${CHAT_NUMBER_OF_RESULTS:-5}
      - CHAT_MAX_TOKENS=${CHAT_MAX_TOKENS:-1200}
    volumes:
      - backend_uploads:/app/storage/uploads
    command: ["sh", "-c", "alembic upgrade head && python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"]

  ingestion-worker:
    build:
      context: ./backend
    profiles: ["worker"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/scholarship
      - UPLOAD_DIR=/app/storage/uploads
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - AWS_REGION=${AWS_REGION:-ap-northeast-1}
      - INGESTION_S3_BUCKET=${INGESTION_S3_BUCKET:-}
      - INGESTION_ORIGINAL_PREFIX=${INGESTION_ORIGINAL_PREFIX:-documents/admin/originals/}
      - INGESTION_PROCESSOR_MODE=${INGESTION_PROCESSOR_MODE:-aws}
      - INGESTION_PROCESSOR_URL=${INGESTION_PROCESSOR_URL:-}
      - INGESTION_PROCESSOR_TIMEOUT_SECONDS=${INGESTION_PROCESSOR_TIMEOUT_SECONDS:-1800}
      - INGESTION_WORKER_MAX_JOBS=${INGESTION_WORKER_MAX_JOBS:-1000}
      - INGESTION_PDF_KNOWLEDGE_BASE_ID=${INGESTION_PDF_KNOWLEDGE_BASE_ID:-}
      - INGESTION_PDF_DATA_SOURCE_ID=${INGESTION_PDF_DATA_SOURCE_ID:-}
      - INGESTION_WEB_KNOWLEDGE_BASE_ID=${INGESTION_WEB_KNOWLEDGE_BASE_ID:-}
      - INGESTION_WEB_DATA_SOURCE_ID=${INGESTION_WEB_DATA_SOURCE_ID:-}
      - INGESTION_EXCEL_KNOWLEDGE_BASE_ID=${INGESTION_EXCEL_KNOWLEDGE_BASE_ID:-}
      - INGESTION_EXCEL_DATA_SOURCE_ID=${INGESTION_EXCEL_DATA_SOURCE_ID:-}
      - INGESTION_WORD_KNOWLEDGE_BASE_ID=${INGESTION_WORD_KNOWLEDGE_BASE_ID:-}
      - INGESTION_WORD_DATA_SOURCE_ID=${INGESTION_WORD_DATA_SOURCE_ID:-}
      - INGESTION_PPT_KNOWLEDGE_BASE_ID=${INGESTION_PPT_KNOWLEDGE_BASE_ID:-}
      - INGESTION_PPT_DATA_SOURCE_ID=${INGESTION_PPT_DATA_SOURCE_ID:-}
      - INGESTION_TEXT_KNOWLEDGE_BASE_ID=${INGESTION_TEXT_KNOWLEDGE_BASE_ID:-}
      - INGESTION_TEXT_DATA_SOURCE_ID=${INGESTION_TEXT_DATA_SOURCE_ID:-}
      - PDF_VISION_MODEL_ID=${PDF_VISION_MODEL_ID:-}
      - PDF_VISION_MIN_CHARS_PER_PAGE=${PDF_VISION_MIN_CHARS_PER_PAGE:-100}
      - WEB_CRAWL_MAX_DEPTH=${WEB_CRAWL_MAX_DEPTH:-5}
      - WEB_CRAWL_MAX_PAGES=${WEB_CRAWL_MAX_PAGES:-500}
      - KNOWLEDGE_BASE_SYNC_TIMEOUT_SECONDS=${KNOWLEDGE_BASE_SYNC_TIMEOUT_SECONDS:-1800}
    volumes:
      - backend_uploads:/app/storage/uploads:ro
    command: ["sh", "-c", "alembic upgrade head && python -m app.worker"]

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: scholarship
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scholarship"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
  backend_uploads:
  frontend_node_modules:
  frontend_next:
