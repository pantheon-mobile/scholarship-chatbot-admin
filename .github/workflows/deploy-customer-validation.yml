name: Deploy customer validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: scholarship-chatbot-customer-validation
  cancel-in-progress: false

jobs:
  frontend-test:
    if: github.repository == 'technical-innovation/bpaas-aichatbot'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend-test:
    if: github.repository == 'technical-innovation/bpaas-aichatbot'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest

  deploy:
    if: github.repository == 'technical-innovation/bpaas-aichatbot'
    needs: [frontend-test, backend-test]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: infrastructure/package-lock.json
      - name: Show OIDC trust claims
        shell: bash
        run: |
          response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"
          token="$(node -e 'const fs=require("fs"); process.stdout.write(JSON.parse(fs.readFileSync(0,"utf8")).value)' <<<"$response")"
          echo "::add-mask::$token"
          OIDC_TOKEN="$token" node -e '
            const claims = JSON.parse(Buffer.from(process.env.OIDC_TOKEN.split(".")[1], "base64url"));
            console.log(JSON.stringify({iss: claims.iss, aud: claims.aud, sub: claims.sub, ref: claims.ref, repository: claims.repository, job_workflow_ref: claims.job_workflow_ref}, null, 2));
          '
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CUSTOMER_VALIDATION_ROLE_ARN }}
          role-duration-seconds: 7200
          retry-max-attempts: 2
          aws-region: ap-northeast-1
      - name: Deploy tested revision without bootstrap
        run: ./scripts/deploy-customer-validation.sh
      - name: Verify application and AWS resources
        run: ./scripts/smoke-test.sh ScholarshipChatbot-stg01-demo customer-validation-deploy-report.md
      - name: Upload deployment report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-validation-deploy-report-${{ github.run_id }}
          path: infrastructure/customer-validation-deploy-report.md
          if-no-files-found: warn
